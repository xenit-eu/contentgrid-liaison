pluginManagement {
    plugins {
        id 'org.sonarqube' version '7.5.0.8588'
        id 'com.diffplug.spotless' version '8.10.3'
    }
}

plugins {
    id 'eu.xenit.enterprise-conventions.private' version '0.10.0'
    id 'org.ajoberstar.reckon.settings' version '2.0.0'
}

rootProject.name = 'contentgrid-liaison'

reckon {
    defaultInferredScope = 'patch'
    snapshots()
    scopeCalc = calcScopeFromCommitMessages()
    stageCalc = { inventory, targetNormal -> java.util.Optional.empty() }
}

